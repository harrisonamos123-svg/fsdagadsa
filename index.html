<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USA Map Quiz</title><script src="https://cdn.jsdelivr.net/npm/d3@7"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#333;font-family:Arial,Helvetica,sans-serif}.top{background:#fff;border-bottom:1px solid #d3dce4}.topin{max-width:1120px;margin:auto;padding:14px 20px}.brand{color:#1476b8;font-size:28px;font-weight:700}.tabs{display:flex;gap:6px;margin-top:12px}.tab{border:1px solid #cbd5de;background:#fff;color:#555;padding:8px 18px;border-radius:4px;font-weight:700}.tab.active{background:#1677b7;border-color:#1677b7;color:#fff}.wrap{max-width:1120px;margin:auto;padding:18px 20px 35px}.title{font-size:22px;font-weight:700;margin-bottom:4px}.sub{color:#727b83;margin:0 0 14px}.target{background:#1677b7;color:white;text-align:center;font-size:25px;font-weight:700;padding:14px;border-radius:4px;box-shadow:0 1px 2px #c6cdd3}.bar{display:flex;justify-content:space-between;align-items:center;background:white;border:1px solid #d4dde4;border-top:0;padding:10px 14px;gap:12px;flex-wrap:wrap}.bar b{color:#333}.mapcard{margin-top:12px;background:white;border:1px solid #d4dde4;border-radius:4px;padding:8px}.map{width:100%;height:auto;display:block;background:#dceff7}.state{fill:#f7f7f7;stroke:#707980;stroke-width:.65;cursor:pointer;transition:fill .12s}.state:hover{fill:#cfe8f5}.state.done{fill:#79b8d8;stroke:white;stroke-width:1}.state.bad{animation:shake .25s linear 2}.border{fill:none;stroke:#69747c;stroke-width:1;pointer-events:none}.buttons{text-align:center;padding-top:12px}.btn{border:1px solid #c7d1d9;background:#fff;color:#444;border-radius:4px;padding:9px 18px;font-weight:700;cursor:pointer;margin:0 4px}.btn:hover{background:#f0f5f8}.notice{text-align:center;height:25px;padding-top:7px;font-weight:700}.finish{display:none;background:white;border:1px solid #d4dde4;border-radius:4px;text-align:center;margin-top:14px;padding:25px}.finish h2{color:#1677b7}.big{font-size:44px;font-weight:800;color:#1677b7}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:700px){.brand{font-size:23px}.target{font-size:20px}.bar{font-size:14px}.wrap{padding-left:8px;padding-right:8px}}</style></head><body><header class="top"><div class="topin"><div class="brand">USA Map Quiz</div><div class="tabs"><button class="tab active">Pin</button><button class="tab" onclick="typeMode()">Type</button></div></div></header><main class="wrap"><div class="title">The United States: 50 States</div><p class="sub">Find each state on the map. Click the state named above.</p><div class="target" id="target">Loading map…</div><div class="bar"><span>Progress: <b id="progress">0 / 50</b></span><span>Correct: <b id="correct">0</b></span><span>Mistakes: <b id="mistakes">0</b></span><span>Time: <b id="time">0:00</b></span></div><div class="mapcard"><svg id="map" class="map" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet"></svg></div><div class="notice" id="notice"></div><div class="buttons"><button class="btn" onclick="restart()">Restart</button><button class="btn" onclick="skip()">Skip</button></div><section class="finish" id="finish"><h2>Quiz complete!</h2><div class="big" id="finalScore">100%</div><p id="finalText"></p><button class="btn" onclick="restart()">Play Again</button></section></main><script>const states={01:'Alabama',02:'Alaska',04:'Arizona',05:'Arkansas',06:'California',08:'Colorado',09:'Connecticut',10:'Delaware',12:'Florida',13:'Georgia',15:'Hawaii',16:'Idaho',17:'Illinois',18:'Indiana',19:'Iowa',20:'Kansas',21:'Kentucky',22:'Louisiana',23:'Maine',24:'Maryland',25:'Massachusetts',26:'Michigan',27:'Minnesota',28:'Mississippi',29:'Missouri',30:'Montana',31:'Nebraska',32:'Nevada',33:'New Hampshire',34:'New Jersey',35:'New Mexico',36:'New York',37:'North Carolina',38:'North Dakota',39:'Ohio',40:'Oklahoma',41:'Oregon',42:'Pennsylvania',44:'Rhode Island',45:'South Carolina',46:'South Dakota',47:'Tennessee',48:'Texas',49:'Utah',50:'Vermont',51:'Virginia',53:'Washington',54:'West Virginia',55:'Wisconsin',56:'Wyoming'};let features=[],order=[],index=0,correct=0,mistakes=0,seconds=0,timer=null,ready=false;const svg=d3.select('#map'),projection=d3.geoAlbersUsa(),path=d3.geoPath(projection);const el=id=>document.getElementById(id);function fmt(){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}function tick(){seconds++;el('time').textContent=fmt()}function start(){if(!timer)timer=setInterval(tick,1000)}function update(){if(index<50){el('target').textContent='Find: '+states[order[index]];el('progress').textContent=(index+1)+' / 50'}el('correct').textContent=correct;el('mistakes').textContent=mistakes;el('notice').textContent=''}function clickState(e,d){if(!ready||index>=50)return;start();const id=String(d.id).padStart(2,'0');if(id===order[index]){d3.select(e.currentTarget).classed('done',true);correct++;index++;el('correct').textContent=correct;el('notice').textContent='Correct!';el('notice').style.color='#27864b';if(index===50)finish();else setTimeout(update,180)}else{mistakes++;el('mistakes').textContent=mistakes;el('notice').textContent='Try again';el('notice').style.color='#a33b3b';const p=d3.select(e.currentTarget);p.classed('bad',true);setTimeout(()=>p.classed('bad',false),500)}}function finish(){clearInterval(timer);timer=null;el('target').textContent='Finished!';el('finish').style.display='block';el('finalScore').textContent=Math.round(correct/50*100)+'%';el('finalText').textContent='50 states completed with '+mistakes+' wrong clicks. Time: '+fmt()}function skip(){if(!ready||index>=50)return;start();index++;if(index>=50)finish();else update()}function restart(){clearInterval(timer);timer=null;seconds=0;correct=0;mistakes=0;index=0;order=features.map(d=>String(d.id).padStart(2,'0')).sort(()=>Math.random()-.5);svg.selectAll('.state').classed('done',false);el('finish').style.display='none';el('time').textContent='0:00';ready=true;update()}function typeMode(){alert('Pin mode is active. Type mode can be added as a separate game mode later.')}d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(us=>{features=topojson.feature(us,us.objects.states).features.filter(d=>states[String(d.id).padStart(2,'0')]);projection.fitSize([940,580],{type:'FeatureCollection',features});svg.append('rect').attr('width',960).attr('height',600).attr('fill','#dceff7');svg.append('g').selectAll('path').data(features).join('path').attr('class','state').attr('d',path).on('click',clickState).append('title').text(d=>states[String(d.id).padStart(2,'0')]);svg.append('path').datum(topojson.mesh(us,us.objects.states,(a,b)=>a!==b)).attr('class','border').attr('d',path);restart()}).catch(()=>el('target').textContent='Map failed to load. Please refresh.');</script></body></html>
