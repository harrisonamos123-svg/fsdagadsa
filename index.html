<script>
const qs=[
['Appalachian Mountains','appalachian'],['Rocky Mountains','rockies'],['Sierra Nevada Mountains','sierra'],['Pacific Ocean','pacific'],['Atlantic Ocean','atlantic'],['Arctic Ocean','arctic'],['Gulf of Mexico','gulf'],['Lake Superior','superior'],['Lake Michigan','michigan'],['Lake Huron','huron'],['Lake Erie','erie'],['Lake Ontario','ontario'],['Great Salt Lake','salt'],['Mississippi River','mississippi'],['Missouri River','missouri'],['Ohio River','ohio'],['Colorado River','colorado'],['Rio Grande','rio'],['Red River','red'],['Columbia River','columbia'],['Snake River','snake'],['Tennessee River','tennessee'],['Hudson River','hudson'],['James River','james'],['Yellowstone River','yellowstone']];
let n=0,score=0,miss=0,active=false;
const q=document.getElementById('q'),msg=document.getElementById('msg');
function startQuiz(){n=0;score=0;miss=0;active=true;document.getElementById('score').textContent=0;document.getElementById('miss').textContent=0;document.querySelectorAll('.hit').forEach(x=>x.classList.remove('good','bad'));next();}
function next(){if(n>=qs.length){q.textContent='Quiz complete!';msg.textContent=`Final score: ${score}/${qs.length} — ${Math.round(score/qs.length*100)}%`;active=false;return}q.textContent=`Find: ${qs[n][0]}`;msg.textContent='';}
document.querySelectorAll('.hit').forEach(el=>el.addEventListener('click',()=>{if(!active)return;const wanted=qs[n][1];if(el.dataset.id===wanted){el.classList.add('good');score++;document.getElementById('score').textContent=score;msg.textContent='✓ Correct!';n++;setTimeout(()=>{el.classList.remove('good');next()},450)}else{el.classList.add('bad');miss++;document.getElementById('miss').textContent=miss;msg.textContent='✗ Not there — try again!';setTimeout(()=>el.classList.remove('bad'),300)}}));
</script></body></html>
