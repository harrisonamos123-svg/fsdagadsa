<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USA Physical Features — Pin Quiz</title><style>body{margin:0;background:#eef3f7;font:16px Arial;color:#333}.top{background:white;border-bottom:1px solid #ccd5dd}.topin{max-width:1050px;margin:auto;padding:14px}.brand{font-size:27px;font-weight:bold;color:#1476b8}.wrap{max-width:1050px;margin:auto;padding:16px 12px}.title{font-weight:bold;font-size:21px}.sub{color:#68737c}.target{background:#1677b7;color:white;text-align:center;font-size:24px;font-weight:bold;padding:13px;border-radius:4px}.bar{display:flex;justify-content:space-between;flex-wrap:wrap;background:white;border:1px solid #d4dde4;padding:10px 13px}.mapcard{margin-top:12px;background:white;border:1px solid #d4dde4;padding:7px}.map{position:relative;width:100%;aspect-ratio:1.32;background:#dceff8;overflow:hidden}.land{fill:#f4f1df;stroke:#707b80;stroke-width:1}.water{fill:#dceff8}.river{fill:none;stroke:#5598c5;stroke-width:2}.lake{fill:#c7e5f3;stroke:#6e9eb5;stroke-width:1}.spot{fill:transparent;stroke:transparent;cursor:pointer}.spot:hover{fill:#1677b733;stroke:#1677b3;stroke-width:1}.done{fill:#27864b88;stroke:#27864b;stroke-width:1}.bad{fill:#b437373d;stroke:#a33b3b;stroke-width:1}.label{font-size:4px;fill:#4b555b;pointer-events:none}.ocean{font-size:5px;fill:#5b88a2;font-style:italic;pointer-events:none}.btn{border:1px solid #c7d1d9;background:white;padding:9px 18px;border-radius:4px;font-weight:bold;margin:10px 4px}.notice{text-align:center;min-height:28px;padding-top:8px;font-weight:bold}.finish{display:none;background:white;border:1px solid #d4dde4;text-align:center;margin-top:14px;padding:20px}.big{font-size:42px;color:#1677b7;font-weight:bold}@media(max-width:650px){.brand{font-size:23px}.target{font-size:19px}}</style></head><body><header class="top"><div class="topin"><div class="brand">USA Physical Features</div></div></header><main class="wrap"><div class="title">United S tion class="finish" id="finish"><h2>Quiz complete!</h2><div class="big" id="finalScore">100%</div><p id="finalText"></p><button class="btn" onclick="restart()">Play Again</button></section></main><script>const data=[['Appalachian Mountains',228,117,24,25],['Rocky Mountains',73,111,25,42],['Sierra Nevada Mountains',52,120,14,35],['Atlantic Ocean',281,120,22,60],['Pacific Ocean',12,133,22,70],['Columbia River',60,87,30,13],['Colorado River',86,137,25,14],['Mississippi River',160,139,25,55],['Gulf of Mexico',190,180,48,18],['Hudson River',253,88,12,25],['James River',236,136,17,20],['Red River',186,158,27,13],['Rio Grande',164,164,18,42],['Snake River',70,96,23,13],['Tennessee River',197,146,22,18],['Yellowstone River',92,85,22,13],['Lake Erie',225,91,14,9],['Lake Huron',223,77,13,15],['Lake Michigan',212,86,13,20],['Lake Ontario',237,81,12,9],['Lake Superior',203,72,23,10],['Missouri River',141,118,28,27],['Ohio River',203,131,29,13],['Arctic Ocean',105,17,45,13],['Great Plains',135,112,52,58],['Canada',168,52,112,24],['Mexico',140,177,65,24]];let order=[],index=0,correct=0,mistakes=0,seconds=0,timer=null,finished=false;const svg=document.getElementById('spots');function fmt(){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}function start(){if(!timer&&!finished)timer=setInterval(()=>{seconds++;time.textContent=fmt()},1000)}function update(){target.textContent=index<data.length?'Find: '+data[order[index]][0]:'Finished!';progress.textContent=Math.min(index,data.length)+' / '+data.length;correctEl.textContent=correct;mistakesEl.textContent=mistakes}function pick(i,e){if(finished||index>=data.length)return;start();if(i===order[index]){e.classList.remove('bad');e.classList.add('done');correct++;index++;notice.textContent='Correct!';notice.style.color='#27864b';update();if(index===data.length)finish()}else{mistakes++;e.classList.remove('bad');void e.offsetWidth;e.classList.add('bad');notice.textContent='Wrong location — try again';notice.style.color='#a
